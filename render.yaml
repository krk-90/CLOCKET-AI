services:
  - type: web
    name: clocket-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # === Supabase (set values in Render dashboard) ===
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false

      # === LLM (set values in Render dashboard) ===
      - key: GROQ_API_KEY
        sync: false

      # === GitHub (set values in Render dashboard) ===
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MCP_ALLOW_WRITE
        value: "false"

      # === Clocket AI Analysis ===
      - key: CLOCKET_AI_LLM_MODEL
        value: "openai/gpt-oss-20b"
      - key: ANALYSIS_MAX_FILE_SIZE_KB
        value: "500"
      - key: ANALYSIS_MAX_FILES
        value: "200"

      # === CORS — set to your Render service URL in the dashboard ===
      # e.g. https://clocket-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # === RAG ===
      - key: RAG_EMBEDDING_MODEL
        value: "BAAI/bge-small-en-v1.5"
      - key: RAG_INDEX_REPO
        value: "false"

      # === LangSmith Tracing ===
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: clocket-ai
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com

      # === Mem0 Long-Term Memory ===
      - key: MEM0_ENABLED
        value: "false"
      - key: MEM0_LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: MEM0_EMBEDDING_MODEL
        value: "BAAI/bge-small-en-v1.5"
      - key: MEM0_HISTORY_DB_PATH
        value: "/app/data/mem0-history.db"
