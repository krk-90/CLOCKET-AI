[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
loglevel=info

[program:api]
directory=/app
command=uvicorn app.main:fastapi_app --host 0.0.0.0 --port %(ENV_PORT)s
autostart=true
autorestart=true
startsecs=3
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp]
directory=/app
command=python -m mcp_server.tools
autostart=true
autorestart=true
startsecs=3
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0