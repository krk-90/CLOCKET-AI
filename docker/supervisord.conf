; supervisord runs as non-root (appuser uid=10001).
; All paths that need write access must live under /tmp.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
directory=/app
command=uvicorn app.main:fastapi_app --host 0.0.0.0 --port %(ENV_PORT)s
autostart=true
autorestart=true
startsecs=3
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp]
directory=/app
command=python -m mcp_server.tools
autostart=true
autorestart=true
startsecs=3
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
